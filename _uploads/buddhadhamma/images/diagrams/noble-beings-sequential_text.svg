<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="177" viewBox="0.0 -1.0 800 177" role="img" aria-label="七圣者次第" font-family="'PaliLatin','Noto Sans CJK SC',sans-serif" fill="#2c3e50">
<title>七圣者次第</title>
