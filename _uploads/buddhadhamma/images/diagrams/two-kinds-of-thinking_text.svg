<line x1="424.0" y1="70.0" x2="650.2" y2="70.0" stroke="#4a5866" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="330.0" y="170.0" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">如理作意</text>
<text x="330.0" y="194.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#6b7785" font-style="italic">yoniso-manasikāra</text>
