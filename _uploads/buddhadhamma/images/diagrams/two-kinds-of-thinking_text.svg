<text x="70.0" y="60.0" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">触</text>
<text x="70.0" y="84.0" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#6b7785" font-style="italic">phassa</text>
