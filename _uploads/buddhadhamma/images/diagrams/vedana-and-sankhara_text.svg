<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0.0 0.0 800 530" role="img" aria-label="受（vedanā）与行（saṅkhāra）的关系" font-family="'PaliLatin','Noto Sans CJK SC',sans-serif" fill="#2c3e50">
<title>受（vedanā）与行（saṅkhāra）的关系</title>
<rect x="0.0" y="0.0" width="800" height="530" fill="#FFFFFF"/>
<defs><style>@font-face{font-family:'PaliLatin';src:local('Source Sans 3'),local('SourceSans3-Regular');font-weight:200 900;unicode-range:U+0000-024F,U+1E00-1EFF;}@font-face{font-family:'PaliLatin';font-style:italic;src:local('Source Sans 3 Italic'),local('SourceSans3-Italic');font-weight:200 900;unicode-range:U+0000-024F,U+1E00-1EFF;}</style><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/></marker></defs>
<rect width="800" height="530" fill="#ffffff"/>
<g transform="translate(70.0,-3.0)">
<rect x="40.0" y="24.0" width="380.0" height="64.0" rx="6" fill="#fff" stroke="#4a5866" stroke-width="1.4"/>
<text x="54.0" y="46.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">看见可意的色</text>
<text x="54.0" y="71.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">cakkhu + iṭṭhārammaṇa + cakkhu-viññāṇa</text>
<polyline points="130.0,88.0 130.0,135.0 176.0,135.0" fill="none" stroke="#4a5866" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="180.0" y="103.0" width="220.0" height="64.0" rx="6" fill="#fff" stroke="#4a5866" stroke-width="1.4"/>
<text x="194.0" y="125.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">乐受</text>
<text x="194.0" y="150.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">sukha-vedanā</text>
<polyline points="270.0,167.0 270.0,214.0 316.0,214.0" fill="none" stroke="#4a5866" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="320.0" y="182.0" width="300.0" height="64.0" rx="6" fill="#fff" stroke="#4a5866" stroke-width="1.4"/>
<text x="334.0" y="204.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">（对该所缘）喜爱</text>
<text x="334.0" y="229.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">saṅkhāra：rāga（贪）</text>
<rect x="40.0" y="290.0" width="380.0" height="64.0" rx="6" fill="#fff" stroke="#4a5866" stroke-width="1.4"/>
<text x="54.0" y="312.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">听到恼人的声</text>
<text x="54.0" y="337.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">sota + aniṭṭhārammaṇa + sota-viññāṇa</text>
<polyline points="130.0,354.0 130.0,401.0 176.0,401.0" fill="none" stroke="#4a5866" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="180.0" y="369.0" width="220.0" height="64.0" rx="6" fill="#fff" stroke="#4a5866" stroke-width="1.4"/>
<text x="194.0" y="391.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">苦受</text>
<text x="194.0" y="416.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">dukkha-vedanā</text>
<polyline points="270.0,433.0 270.0,480.0 316.0,480.0" fill="none" stroke="#4a5866" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="320.0" y="448.0" width="300.0" height="64.0" rx="6" fill="#fff" stroke="#4a5866" stroke-width="1.4"/>
<text x="334.0" y="470.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">（对该所缘）厌恶</text>
<text x="334.0" y="495.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">saṅkhāra：dosa（嗔）</text>
</g>
</svg>