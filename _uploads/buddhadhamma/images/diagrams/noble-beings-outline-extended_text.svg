<text x="424.0" y="490.0" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785">须陀洹：已断三结</text>
<text x="424.0" y="512.0" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785">斯陀含：贪、嗔、痴已薄弱</text>
<text x="424.0" y="534.0" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785">阿那含：再断二结</text>
<text x="600.0" y="490.0" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785">阿罗汉：断除最后五结，</text>
<text x="600.0" y="512.0" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785">即全部十结</text>
