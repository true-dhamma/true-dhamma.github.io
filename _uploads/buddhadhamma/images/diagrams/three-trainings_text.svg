<text x="550.0" y="36.0" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">3. 增上慧学</text>
<text x="550.0" y="62.0" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#6b7785" font-style="italic">adhipaññā-sikkhā</text>
