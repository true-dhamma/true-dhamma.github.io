<text x="50.0" y="144.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">正业</text>
<text x="50.0" y="176.0" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">正命</text>
<text x="300.0" y="36.0" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">2. 增上心学</text>
