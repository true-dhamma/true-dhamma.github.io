<text x="32" y="43" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="500" fill="rgb(44, 62, 80)">四圣谛</text>
<text x="152.31" y="43" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="500" fill="rgb(44, 62, 80)">真理智</text>
<text x="152.31" y="63.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="500" font-style="italic" fill="rgb(107, 119, 133)">sacca-ñāṇa</text>
<text x="362.87" y="43" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="500" fill="rgb(44, 62, 80)">职责智</text>
<text x="362.87" y="63.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="500" font-style="italic" fill="rgb(107, 119, 133)">kicca-ñāṇa</text>
<text x="573.42" y="43" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="500" fill="rgb(44, 62, 80)">已作智</text>
<text x="573.42" y="63.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="500" font-style="italic" fill="rgb(107, 119, 133)">kata-ñāṇa</text>
<text x="32" y="98" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">苦</text>
<text x="32" y="118.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="400" font-style="italic" fill="rgb(107, 119, 133)">dukkha</text>
<text x="152.31" y="98" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知苦是如此；知问题是什</text>
<text x="152.31" y="120.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">么。</text>
<text x="362.87" y="98" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知苦应遍知；知必须了解问</text>
<text x="362.87" y="120.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">题的性质和范围。</text>
<text x="573.42" y="98" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知苦已遍知；知已了解问题</text>
<text x="573.42" y="120.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">的性质和范围。</text>
<text x="32" y="156" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">集</text>
<text x="32" y="176.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="400" font-style="italic" fill="rgb(107, 119, 133)">samudaya</text>
<text x="152.31" y="156" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知苦因是如此；知渴爱是苦</text>
<text x="152.31" y="178.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">因；知问题的原因是什么。</text>
<text x="362.87" y="156" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知苦因应断除；知必须断除</text>
<text x="362.87" y="178.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">渴爱；知必须从根源上解决</text>
<text x="362.87" y="201" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">问题。</text>
<text x="573.42" y="156" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知苦因已断除；知渴爱已断</text>
<text x="573.42" y="178.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">除；知问题的根源已被消</text>
<text x="573.42" y="201" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">除。</text>
<text x="32" y="236.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">灭</text>
<text x="32" y="257" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="400" font-style="italic" fill="rgb(107, 119, 133)">nirodha</text>
<text x="152.31" y="236.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知灭是如此；知涅槃是苦的</text>
<text x="152.31" y="259" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">止息；知什么是真正值得追</text>
<text x="152.31" y="281.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">求的。</text>
<text x="362.87" y="236.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知灭应现证；知涅槃应现</text>
<text x="362.87" y="259" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">证；知这就是目标。</text>
<text x="573.42" y="236.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知灭——涅槃——已现证；知</text>
<text x="573.42" y="259" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">目标已经达到。</text>
<text x="32" y="317" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">道</text>
<text x="32" y="337.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="13px" font-weight="400" font-style="italic" fill="rgb(107, 119, 133)">magga</text>
<text x="152.31" y="317" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知道是如此；知灭苦之道有</text>
<text x="152.31" y="339.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">八支；知有哪些解决问题的</text>
<text x="152.31" y="362" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">方法。</text>
<text x="362.87" y="317" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知道应修习；知应修习八正</text>
<text x="362.87" y="339.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">道；知应着手并运用解决问</text>
<text x="362.87" y="362" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">题的方法。</text>
<text x="573.42" y="317" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">知道已修习；知已依八正道</text>
<text x="573.42" y="339.5" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">而行；知已完成并结束了解</text>
<text x="573.42" y="362" xml:space="preserve" font-family="PaliLatin, 'Noto Sans CJK SC', sans-serif" font-size="15px" font-weight="400" fill="rgb(44, 62, 80)">决问题的方法。</text>
</svg>
